<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Карта навыков</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500&family=Fira+Sans+Extra+Condensed:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #070912;
        --bg2: #0d1226;
        --nebula1: #1c2450;
        --nebula2: #2a1f4d;
        --star: #bcd8ff;
        --star-lit: #7fe3f5;
        --gold: #e8c468;
        --dim: #3a4266;
        --text: #e7ecf7;
        --text-dim: #8b93b8;
        --line: #3d4a7a;
        --line-lit: #6fd0e6;
        --panel: #0b0f22ee;
        --danger: #e2765f;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) {
          --bg: #070912;
        }
      }
      :root[data-theme='dark'] {
        --bg: #070912;
      }
      * {
        box-sizing: border-box;
      }
      html {
        height: 100%;
        scroll-padding-top: env(safe-area-inset-top, 0px);
      }
      body {
        margin: 0;
        height: 100%;
        min-height: 100vh;
        background: var(--bg);
        background-image:
          radial-gradient(ellipse at 15% 15%, #1c4d52 0%, transparent 50%),
          radial-gradient(ellipse at 85% 20%, #2a1f4d 0%, transparent 50%),
          radial-gradient(ellipse at 30% 85%, #143a3f 0%, transparent 55%),
          radial-gradient(ellipse at 80% 80%, var(--nebula2) 0%, transparent 55%),
          radial-gradient(ellipse at 50% 100%, #10163a 0%, transparent 60%),
          radial-gradient(1px 1px at 10% 20%, #ffffff99 1px, transparent 0),
          radial-gradient(1px 1px at 80% 10%, #ffffff66 1px, transparent 0),
          radial-gradient(1px 1px at 60% 70%, #ffffff77 1px, transparent 0),
          radial-gradient(1px 1px at 25% 60%, #ffffff55 1px, transparent 0),
          radial-gradient(1px 1px at 90% 55%, #ffffff88 1px, transparent 0),
          radial-gradient(1px 1px at 45% 35%, #ffffff44 1px, transparent 0),
          radial-gradient(1px 1px at 70% 90%, #ffffff66 1px, transparent 0);
        background-repeat:
          no-repeat, no-repeat, no-repeat, no-repeat, no-repeat, repeat, repeat, repeat, repeat, repeat, repeat, repeat;
        background-size:
          auto,
          auto,
          auto,
          auto,
          auto,
          180px 180px,
          220px 220px,
          260px 260px,
          140px 140px,
          300px 300px,
          200px 200px,
          240px 240px;
        color: var(--text);
        font-family: 'Fira Sans Extra Condensed', system-ui, sans-serif;
        overflow-x: hidden;
      }
      h1,
      h2,
      h3,
      .disp {
        font-family: 'Oswald', sans-serif;
        letter-spacing: 0.02em;
      }
      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: calc(16px + env(safe-area-inset-top, 0px)) 20px 14px;
        border-bottom: 1px solid #ffffff14;
        flex-wrap: wrap;
      }
      .topbar .id {
        display: flex;
        align-items: center;
        gap: 14px;
        flex-wrap: wrap;
      }
      .topbar input {
        background: transparent;
        border: none;
        border-bottom: 1px solid var(--dim);
        color: var(--text);
        font-family: 'Oswald', sans-serif;
        font-size: 1.1rem;
        padding: 4px 2px;
        width: 180px;
      }
      .topbar input:focus {
        outline: none;
        border-color: var(--gold);
      }
      .levelchip {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 14px;
        border: 1px solid var(--dim);
        border-radius: 3px;
        font-size: 0.85rem;
        color: var(--text-dim);
      }
      .levelchip b {
        color: var(--gold);
        font-family: 'Oswald', sans-serif;
        font-size: 1.15rem;
      }
      .hexOrn {
        width: 14px;
        height: 14px;
        border: 1px solid var(--dim);
        clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
        display: inline-block;
        margin: 0 4px;
      }
      .chev {
        color: var(--dim);
        font-size: 0.75rem;
        letter-spacing: -2px;
      }
      .ornWrap {
        display: inline-flex;
        align-items: center;
      }
      .hint {
        padding: 10px 20px;
        font-size: 0.82rem;
        color: var(--text-dim);
        max-width: 640px;
        line-height: 1.5;
      }
      .readout {
        text-align: center;
        padding: 10px 20px 6px;
        min-height: 82px;
      }
      .readout .rname {
        font-family: 'Oswald', sans-serif;
        font-size: 1.5rem;
        color: var(--gold);
      }
      .readout .rname b {
        font-size: 2rem;
        margin-left: 10px;
        color: var(--gold);
      }
      .readout .rule {
        width: 200px;
        height: 1px;
        margin: 8px auto;
        background: linear-gradient(90deg, transparent, var(--line-lit), transparent);
      }
      .readout .rdesc {
        font-size: 0.8rem;
        color: var(--text-dim);
        max-width: 520px;
        margin: 0 auto;
        line-height: 1.5;
        min-height: 1.2em;
      }
      .skyWrap {
        position: relative;
        width: 100%;
        max-width: 1200px;
        margin: 0 auto;
        height: 62vh;
        min-height: 380px;
        overflow: hidden;
        border-radius: 10px;
        cursor: grab;
        border: 1px solid #ffffff10;
      }
      .skyWrap.dragging {
        cursor: grabbing;
      }
      svg#sky {
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
      }
      #camera {
        transition: transform 0.5s cubic-bezier(0.22, 0.9, 0.34, 1);
      }
      #camera.dragging {
        transition: none;
      }
      .zoomCtl {
        position: absolute;
        right: 10px;
        bottom: 10px;
        display: flex;
        flex-direction: column;
        gap: 6px;
        z-index: 5;
      }
      .zoomCtl button {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        border: 1px solid var(--dim);
        background: #0b0f22cc;
        color: var(--text);
        font-size: 1rem;
        cursor: pointer;
      }
      .zoomCtl button:hover {
        border-color: var(--gold);
        color: var(--gold);
      }
      .star {
        cursor: pointer;
      }
      .star circle.core {
        transition:
          r 0.2s,
          filter 0.2s;
      }
      .star:hover circle.core {
        filter: brightness(1.4);
      }
      .star text {
        font-family: 'Fira Sans Extra Condensed', sans-serif;
        font-size: 13px;
        fill: var(--text-dim);
        pointer-events: none;
      }
      .star text.lvl {
        font-family: 'Oswald', sans-serif;
        fill: var(--gold);
        font-size: 14px;
      }
      .constline {
        stroke: var(--line);
        stroke-width: 1;
        fill: none;
        opacity: 0.55;
      }
      .constline.lit {
        stroke: var(--line-lit);
        opacity: 0.9;
        filter: drop-shadow(0 0 3px var(--line-lit));
      }
      .legend {
        display: flex;
        flex-wrap: wrap;
        gap: 10px 22px;
        padding: 6px 20px 30px;
        font-size: 0.78rem;
        color: var(--text-dim);
      }
      .legend span {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .legend i {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        display: inline-block;
      }

      .overlay {
        position: fixed;
        inset: 0;
        background: #02040ccc;
        display: none;
        z-index: 20;
        align-items: flex-end;
        justify-content: center;
      }
      .overlay.open {
        display: flex;
      }
      .panel {
        width: 100%;
        max-width: 520px;
        max-height: 88vh;
        overflow-y: auto;
        background: var(--panel);
        border: 1px solid var(--dim);
        border-bottom: none;
        border-radius: 14px 14px 0 0;
        padding: 22px 22px calc(26px + env(safe-area-inset-bottom, 0px));
        box-shadow: 0 -10px 40px #000a;
      }
      @media (min-width: 700px) {
        .overlay {
          align-items: center;
        }
        .panel {
          border-radius: 14px;
          border-bottom: 1px solid var(--dim);
          max-height: 80vh;
        }
      }
      .panel h2 {
        margin: 0 0 4px;
        font-size: 1.3rem;
        color: var(--gold);
      }
      .panel .sub {
        color: var(--text-dim);
        font-size: 0.85rem;
        margin-bottom: 16px;
      }
      .closeBtn {
        float: right;
        background: none;
        border: 1px solid var(--dim);
        color: var(--text-dim);
        width: 30px;
        height: 30px;
        border-radius: 50%;
        cursor: pointer;
        font-size: 1rem;
      }
      .progressRow {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 10px 0 18px;
      }
      .bar {
        flex: 1;
        height: 8px;
        background: #ffffff14;
        border-radius: 4px;
        overflow: hidden;
      }
      .bar > i {
        display: block;
        height: 100%;
        background: linear-gradient(90deg, var(--line-lit), var(--gold));
      }
      .tierRow {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        margin-bottom: 18px;
      }
      .tierBtn {
        padding: 6px 12px;
        border-radius: 20px;
        border: 1px solid var(--dim);
        background: transparent;
        color: var(--text-dim);
        font-size: 0.8rem;
        cursor: pointer;
        font-family: 'Oswald', sans-serif;
      }
      .tierBtn.done {
        border-color: var(--gold);
        color: var(--gold);
      }
      .tierBtn.active {
        background: var(--gold);
        color: #161225;
        border-color: var(--gold);
      }
      form.addForm {
        border-top: 1px solid #ffffff14;
        padding-top: 16px;
        margin-top: 6px;
        display: grid;
        gap: 10px;
      }
      form.addForm label {
        font-size: 0.78rem;
        color: var(--text-dim);
        display: block;
        margin-bottom: 4px;
      }
      form.addForm input[type='text'],
      form.addForm input[type='date'],
      form.addForm select {
        width: 100%;
        padding: 9px 10px;
        background: #ffffff0c;
        border: 1px solid var(--dim);
        border-radius: 6px;
        color: var(--text);
        font-size: 0.9rem;
      }
      form.addForm input[type='file'] {
        color: var(--text-dim);
        font-size: 0.8rem;
      }
      .btn {
        padding: 10px 16px;
        background: var(--gold);
        color: #1a1330;
        border: none;
        border-radius: 6px;
        font-weight: 600;
        cursor: pointer;
        font-family: 'Oswald', sans-serif;
        letter-spacing: 0.03em;
      }
      .btn:disabled {
        opacity: 0.5;
        cursor: default;
      }
      .entries {
        margin-top: 18px;
        display: grid;
        gap: 10px;
      }
      .entry {
        display: flex;
        gap: 10px;
        align-items: center;
        border: 1px solid #ffffff14;
        border-radius: 8px;
        padding: 8px;
        background: #ffffff06;
      }
      .entry img,
      .entry video {
        width: 52px;
        height: 52px;
        object-fit: cover;
        border-radius: 6px;
        background: #000;
      }
      .entry .meta {
        flex: 1;
        min-width: 0;
      }
      .entry .meta .t {
        font-size: 0.85rem;
      }
      .entry .meta .d {
        font-size: 0.72rem;
        color: var(--text-dim);
      }
      .empty {
        color: var(--text-dim);
        font-size: 0.85rem;
        font-style: italic;
        padding: 10px 0;
      }
      .stubNote {
        color: var(--text-dim);
        font-size: 0.88rem;
        line-height: 1.6;
        padding: 8px 0 4px;
      }

      body {
        font-size: 17px;
      }
      .lbl {
        font-size: 0.7rem;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        color: var(--text-dim);
      }
      .openWrap {
        text-align: center;
        padding: 10px 0 0;
      }
      .openBtn {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 9px 44px;
        background: #0a0f1fdd;
        border: none;
        border-top: 1px solid #9aa6c8;
        border-bottom: 1px solid #9aa6c8;
        color: var(--text);
        font-family: 'Oswald', sans-serif;
        font-weight: 300;
        font-size: 1.05rem;
        clip-path: polygon(0 0, 100% 0, 94% 100%, 6% 100%);
        cursor: pointer;
      }
      .openBtn:hover {
        color: var(--gold);
      }
      kbd {
        border: 1px solid #9aa6c8;
        border-radius: 5px;
        padding: 0 6px;
        font-size: 0.72rem;
        background: #ffffff14;
        font-family: inherit;
      }
      .stage {
        position: relative;
        height: clamp(240px, 44vh, 420px);
        overflow: hidden;
        touch-action: pan-y;
        --cw: min(58vw, 400px);
      }
      @media (min-width: 700px) {
        .stage {
          --cw: min(40vw, 400px);
        }
      }
      .track {
        position: absolute;
        inset: 0;
      }
      .const {
        position: absolute;
        left: 50%;
        top: 0;
        width: var(--cw);
        height: 100%;
        margin-left: calc(var(--cw) / -2);
        transition:
          transform 0.55s cubic-bezier(0.22, 0.9, 0.3, 1),
          opacity 0.55s;
        cursor: pointer;
      }
      .const svg {
        width: 100%;
        height: 100%;
        display: block;
        overflow: visible;
      }
      .navBtn {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        z-index: 3;
        background: #0b0f22aa;
        border: 1px solid var(--dim);
        color: var(--text);
        width: 36px;
        height: 54px;
        font-size: 1.6rem;
        cursor: pointer;
      }
      .navBtn.l {
        left: 6px;
      }
      .navBtn.r {
        right: 6px;
      }
      .names {
        position: relative;
        height: 88px;
        overflow: hidden;
        margin-top: 6px;
        --nw: 150px;
      }
      .cname {
        position: absolute;
        left: 50%;
        top: 0;
        width: var(--nw);
        margin-left: calc(var(--nw) / -2);
        text-align: center;
        transition:
          transform 0.55s cubic-bezier(0.22, 0.9, 0.3, 1),
          opacity 0.55s,
          color 0.3s;
        color: #8f9bc2;
        cursor: pointer;
        white-space: nowrap;
        font-family: 'Oswald', sans-serif;
        font-weight: 300;
      }
      .cname .nm {
        font-size: 1rem;
        transition: font-size 0.4s;
      }
      .cname .lv {
        font-size: 1.05rem;
        font-weight: 400;
        margin-left: 6px;
        color: #dfe6f7;
        transition: font-size 0.4s;
      }
      .cname.sel {
        color: #fff;
        z-index: 2;
      }
      .cname.sel .nm {
        font-size: clamp(1.1rem, 3.4vw, 1.8rem);
      }
      .cname.sel .lv {
        font-size: clamp(1.4rem, 4.4vw, 2.4rem);
      }
      .plate {
        height: 9px;
        width: 78%;
        margin: 8px auto 0;
        background: linear-gradient(#5a6486, #2a3152);
        clip-path: polygon(0 0, 100% 0, 90% 100%, 10% 100%);
        opacity: 0.8;
      }
      .cname.sel .plate {
        width: 96%;
        background: linear-gradient(#cfd8f0, #6a7398);
        opacity: 1;
      }
      .descWrap {
        text-align: center;
        padding: 10px 18px calc(28px + env(safe-area-inset-bottom, 0px));
      }
      .gname {
        color: var(--gold);
        letter-spacing: 0.16em;
        font-size: 0.72rem;
        text-transform: uppercase;
        font-family: 'Oswald', sans-serif;
      }
      .desc {
        max-width: 620px;
        margin: 6px auto 0;
        font-size: 1.05rem;
        line-height: 1.5;
        color: #e8ecf6;
      }
      .subRow {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 12px 14px;
        background: #ffffff08;
        border: 1px solid #ffffff14;
        border-radius: 8px;
        color: var(--text);
        font-family: 'Oswald', sans-serif;
        font-size: 1.05rem;
        cursor: pointer;
      }
      .subRow b {
        color: var(--gold);
      }
      .subRow:hover {
        border-color: var(--gold);
      }
      .backBtn {
        background: none;
        border: none;
        color: var(--text-dim);
        cursor: pointer;
        font-size: 0.85rem;
        padding: 0;
        margin-bottom: 8px;
      }
      .plate {
        height: 10px;
        background: #0d1330;
        box-shadow: inset 0 0 0 1px #3a4266;
        overflow: hidden;
        opacity: 0.95;
      }
      .plate i {
        display: block;
        height: 100%;
        background: linear-gradient(90deg, #7fe3ff, #ffb347);
        transition: width 0.6s;
      }
      .cname.sel .plate {
        background: #0d1330;
        box-shadow: inset 0 0 0 1px #9aa6c8;
        opacity: 1;
      }

      #bg {
        position: fixed;
        inset: -14%;
        z-index: -1;
        pointer-events: none;
        background:
          radial-gradient(ellipse at 18% 32%, #1f7a82aa 0, transparent 46%),
          radial-gradient(ellipse at 82% 72%, #b5602f88 0, transparent 42%),
          radial-gradient(ellipse at 62% 18%, #4b2f8a88 0, transparent 46%);
        transform: translate(var(--bx, 0px), var(--by, 0px)) scale(var(--bs, 1.08));
        transition: transform 0.9s cubic-bezier(0.22, 0.9, 0.3, 1);
      }
      .track {
        transition: opacity 0.35s;
      }
      .zoomLayer {
        position: absolute;
        inset: 0;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.45s;
        z-index: 2;
      }
      .zoomLayer svg {
        width: 100%;
        height: 100%;
        display: block;
        overflow: visible;
      }
      .stage.zoomed {
        height: clamp(300px, 54vh, 560px);
        touch-action: none;
      }
      .stage.zoomed .zoomLayer {
        opacity: 1;
        pointer-events: auto;
      }
      .stage.zoomed .track {
        opacity: 0;
        pointer-events: none;
      }
      .stage.zoomed .navBtn {
        display: none;
      }
      body.zm .names {
        display: none;
      }
      .zback {
        display: none;
        position: absolute;
        left: 10px;
        top: 8px;
        z-index: 4;
        align-items: center;
        gap: 8px;
        background: #0b0f22aa;
        border: 1px solid var(--dim);
        color: var(--text);
        padding: 6px 12px;
        font-family: 'Oswald', sans-serif;
        font-weight: 300;
        cursor: pointer;
      }
      .stage.zoomed .zback {
        display: inline-flex;
      }
      .zs {
        cursor: pointer;
      }
      .zs .core {
        transform-box: fill-box;
        transform-origin: center;
        transition: transform 0.4s;
      }
      .zs.sel .core {
        transform: scale(1.6);
      }
      .zs .halo {
        transform-box: fill-box;
        transform-origin: center;
        transition:
          transform 0.4s,
          opacity 0.4s;
        opacity: 0.15;
      }
      .zs.on .halo {
        opacity: 0.3;
      }
      .zs.sel .halo {
        transform: scale(1.7);
        opacity: 0.4;
      }
      .zs text {
        font-family: 'Oswald', sans-serif;
        font-weight: 300;
        font-size: 3.3px;
        fill: #8f9bc2;
        text-anchor: middle;
        pointer-events: none;
        transition:
          font-size 0.4s,
          fill 0.4s;
      }
      .zs.on text {
        fill: #dfe6f7;
      }
      .zs.sel text {
        font-size: 6px;
        fill: #fff;
      }
      .zinfo {
        display: none;
        justify-content: center;
        gap: 40px;
        margin-top: 10px;
        font-family: 'Oswald', sans-serif;
        font-weight: 300;
        font-size: 1rem;
        color: #aab4d6;
      }
      .zinfo b {
        font-weight: 400;
        margin-left: 8px;
        color: #fff;
      }
      body.zm .zinfo {
        display: flex;
      }

      /* полоски: прежняя форма-трапеция, но с рамкой со всех сторон */
      .plate,
      .zbar {
        --bw: 2px;
        --sl: 12px;
        --bc: #6a7398;
        position: relative;
        padding: var(--bw);
        background: var(--bc);
        clip-path: polygon(0 0, 100% 0, calc(100% - var(--sl)) 100%, var(--sl) 100%);
        height: auto;
        border: none;
        box-shadow: none;
        overflow: visible;
        opacity: 0.9;
      }
      .plate {
        width: 78%;
        margin: 8px auto 0;
      }
      .cname.sel .plate {
        width: 96%;
        --sl: 14px;
        --bc: #cfd8f0;
        background: var(--bc);
        opacity: 1;
      }
      .pin {
        display: block;
        background: #070b1c;
        overflow: hidden;
        clip-path: polygon(
          1px 0,
          calc(100% - 1px) 0,
          calc(100% - (var(--sl) - var(--bw))) 100%,
          calc(var(--sl) - var(--bw)) 100%
        );
      }
      .plate i,
      .zbar i {
        display: block;
        height: 7px;
        width: 0;

      }
      .zinfo {

      }
      .zhead {
        display: flex;

      .up {

      @keyframes pop {
        0% {
          transform: scale(1);

        35% {
          transform: scale(1.4);
          color: #ffb347;
        }
        100% {
          transform: scale(1);

      .mute {
        background: none;
        border: 1px solid var(--dim);

        color: var(--gold);

      }
      .descWrap {
        padding-bottom: calc(112px + env(safe-area-inset-bottom, 0px));
      }

      /* ===== Плеер: карточка из матового стекла, как в референсе ===== */
      body {
        padding-bottom: 64px;
      }
      .player {
        position: fixed;
        right: 16px;
        bottom: calc(76px + env(safe-area-inset-bottom, 0px));
        transform: translateX(26px) scale(0.95);
        transform-origin: bottom right;
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        transition:
          transform 0.32s cubic-bezier(0.22, 0.9, 0.3, 1),
          opacity 0.25s,
          visibility 0s linear 0.32s;
        width: min(92vw, 320px);
        z-index: 10;
        padding: 12px 16px 8px;
        border-radius: 22px;
        color: #fff;
        background: linear-gradient(135deg, rgba(255, 255, 255, 0.22), rgba(255, 255, 255, 0.06));
        -webkit-backdrop-filter: blur(24px) saturate(1.6);
        backdrop-filter: blur(24px) saturate(1.6);
        border: 1.5px solid rgba(255, 255, 255, 0.42);
        box-shadow:
          0 16px 44px rgba(0, 0, 0, 0.42),
          inset 0 1px 0 rgba(255, 255, 255, 0.5);
      }
      .player.open {
        transform: none;
        opacity: 1;
        visibility: visible;
        pointer-events: auto;
        transition:
          transform 0.32s cubic-bezier(0.22, 0.9, 0.3, 1),
          opacity 0.25s,
          visibility 0s;
      }
      .ptog {
        position: fixed;
        right: 16px;
        bottom: calc(16px + env(safe-area-inset-bottom, 0px));
        width: 46px;
        height: 46px;
        border-radius: 50%;
        z-index: 11;
        display: grid;
        place-items: center;
        padding: 0;
        color: #fff;
        cursor: pointer;
        background: linear-gradient(135deg, rgba(255, 255, 255, 0.24), rgba(255, 255, 255, 0.07));
        -webkit-backdrop-filter: blur(18px) saturate(1.6);
        backdrop-filter: blur(18px) saturate(1.6);
        border: 1.5px solid rgba(255, 255, 255, 0.42);
        box-shadow:
          0 8px 24px rgba(0, 0, 0, 0.4),
          inset 0 1px 0 rgba(255, 255, 255, 0.5);
        transition:
          transform 0.2s,
          color 0.2s,
          border-color 0.2s;
      }
      .ptog:hover {
        transform: scale(1.07);
      }
      .ptog svg {
        width: 22px;
        height: 22px;
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .ptog.open {
        color: var(--gold);
        border-color: var(--gold);
      }
      .ptog.playing::after {
        content: '';
        position: absolute;
        top: 6px;
        right: 6px;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #7fe3ff;
        box-shadow: 0 0 8px #7fe3ff;
        animation: ppulse 1.4s ease-in-out infinite;
      }
      @keyframes ppulse {
        0%,
        100% {
          opacity: 1;
          transform: scale(1);
        }
        50% {
          opacity: 0.35;
          transform: scale(0.7);
        }
      }
      .phead {
        display: flex;
        align-items: center;
        gap: 14px;
      }
      .pcover {
        flex: none;
        width: 42px;
        height: 42px;
        border-radius: 12px;
        display: grid;
        place-items: center;
        background: linear-gradient(145deg, #9fd0ff, #4b6cd6);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.55),
          0 4px 12px rgba(0, 0, 0, 0.3);
      }
      .pcover svg {
        width: 20px;
        height: 20px;
        fill: none;
        stroke: #fff;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .pinfo {
        flex: 1;
        min-width: 0;
      }
      .ptitle {
        font-weight: 500;
        font-size: 1rem;
        line-height: 1.2;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .psub {
        font-size: 0.82rem;
        opacity: 0.68;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .pdots {
        flex: none;
        width: 28px;
        height: 28px;
        background: none;
        border: none;
        color: #fff;
        font-size: 1.3rem;
        line-height: 1;
        cursor: pointer;
        opacity: 0.9;
      }
      .ptimes {
        display: flex;
        justify-content: space-between;
        margin-top: 10px;
        font-size: 0.72rem;
        opacity: 0.85;
      }
      .pbar {
        position: relative;
        height: 14px;
        cursor: pointer;
        touch-action: none;
      }
      .pbar::before {
        content: '';
        position: absolute;
        left: 0;
        right: 0;
        top: 5px;
        height: 4px;
        border-radius: 2px;
        background: rgba(255, 255, 255, 0.35);
      }
      .pbar i {
        position: absolute;
        left: 0;
        top: 5px;
        height: 4px;
        width: 0;
        border-radius: 2px;
        background: #fff;
        box-shadow: 0 0 8px rgba(255, 255, 255, 0.5);
      }
      .pctl {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-top: 6px;
      }
      .pc {
        display: grid;
        place-items: center;
        width: 36px;
        height: 36px;
        background: none;
        border: none;
        color: #fff;
        opacity: 0.88;
        cursor: pointer;
        padding: 0;
        transition:
          opacity 0.2s,
          color 0.2s,
          transform 0.15s;
      }
      .pc:hover {
        opacity: 1;
      }
      .pc:active {
        transform: scale(0.92);
      }
      .pc svg {
        width: 21px;
        height: 21px;
        fill: currentColor;
      }
      .pc.play svg {
        width: 34px;
        height: 34px;
      }
      .pc.fav svg {
        fill: none;
        stroke: currentColor;
        stroke-width: 1.8;
      }
      .pc.fav.on {
        color: #ff6b8b;
        opacity: 1;
      }
      .pc.fav.on svg {
        fill: currentColor;
      }
      .ic-pause {
        display: none;
      }
      .player.playing .ic-pause {
        display: block;
      }
      .player.playing .ic-play {
        display: none;
      }
      .mpop,
      .vpop,
      .plist {
        background: rgba(24, 34, 70, 0.55);
        -webkit-backdrop-filter: blur(22px) saturate(1.6);
        backdrop-filter: blur(22px) saturate(1.6);
        border: 1.5px solid rgba(255, 255, 255, 0.35);
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.4);
        border-radius: 16px;
      }
      .mpop {
        position: absolute;
        right: 18px;
        top: 52px;
        display: none;
        padding: 6px;
        min-width: 180px;
        z-index: 2;
      }
      .vpop {
        position: absolute;
        right: 14px;
        bottom: 52px;
        display: none;
        padding: 12px 16px;
      }
      .mpop.open,
      .vpop.open {
        display: block;
      }
      .mi {
        display: block;
        width: 100%;
        text-align: left;
        background: none;
        border: none;
        color: #fff;
        font-size: 1rem;
        padding: 9px 12px;
        border-radius: 10px;
        cursor: pointer;
      }
      .mi:hover {
        background: rgba(255, 255, 255, 0.12);
      }
      .pvol {
        width: 110px;
        accent-color: #fff;
        cursor: pointer;
        vertical-align: middle;
      }
      .plist {
        position: fixed;
        right: 16px;
        bottom: 230px;
        width: min(92vw, 320px);
        max-height: 38vh;
        overflow-y: auto;
        z-index: 10;
        display: none;
        color: #fff;
      }
      .plist.open {
        display: block;
      }
      .pitem {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 16px;
        cursor: pointer;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      }
      .pitem:hover {
        background: rgba(255, 255, 255, 0.09);
      }
      .pitem.cur {
        color: var(--gold);
      }
      .pn {
        flex: 1;
        min-width: 0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .pf {
        color: #ff6b8b;
      }
      .pdel {
        background: none;
        border: none;
        color: #b3bddb;
        font-size: 1.2rem;
        cursor: pointer;
      }
      .pdel:hover {
        color: var(--danger);
      }
      .pempty,
      .pnote {
        padding: 14px 16px;
        color: #c3cbe6;
        font-size: 0.95rem;
        line-height: 1.4;
      }
      .pnote:empty {
        display: none;
      }

      /* ===== Галерея работ и просмотрщик ===== */
      .gal {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(104px, 1fr));
        gap: 10px;
        margin-top: 18px;
      }
      .gi {
        position: relative;
        aspect-ratio: 1;
        overflow: hidden;
        cursor: pointer;
        border-radius: 10px;
        background: #0b1024;
        border: 1px solid rgba(255, 255, 255, 0.14);
        transition:
          transform 0.2s,
          border-color 0.2s;
      }
      .gi:hover,
      .gi:focus-visible {
        transform: translateY(-2px);
        border-color: var(--gold);
        outline: none;
      }
      .gi img,
      .gi video {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      .gtx {
        height: 100%;
        padding: 10px 10px 26px;
        overflow: hidden;
        font-size: 0.74rem;
        line-height: 1.35;
        color: #cfd6ee;
        white-space: pre-wrap;
        word-break: break-word;
      }
      .gtx.big {
        font-size: 0.9rem;
        color: #fff;
      }
      .gfile {
        height: 100%;
        display: grid;
        place-items: center;
        color: #8f9bc2;
        font-size: 0.8rem;
        letter-spacing: 0.12em;
      }
      .gbadge {
        position: absolute;
        top: 6px;
        left: 6px;
        padding: 2px 6px;
        border-radius: 6px;
        font-size: 0.62rem;
        letter-spacing: 0.08em;
        color: #fff;
        background: rgba(0, 0, 0, 0.55);
      }
      .gplay {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        color: #fff;
        font-size: 1.6rem;
        text-shadow: 0 2px 8px #000;
        pointer-events: none;
      }
      .gcap {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        padding: 18px 8px 6px;
        font-size: 0.74rem;
        color: #fff;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        background: linear-gradient(transparent, rgba(0, 0, 0, 0.8));
      }
      .gcap:empty {
        display: none;
      }
      .lb {
        position: fixed;
        inset: 0;
        z-index: 30;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 56px 64px 84px;
        background: rgba(3, 6, 18, 0.84);
        -webkit-backdrop-filter: blur(12px);
        backdrop-filter: blur(12px);
      }
      .lb.open {
        display: flex;
      }
      .lbbody {
        max-width: 100%;
        display: flex;
        justify-content: center;
        touch-action: pan-y;
      }
      .lbbody img,
      .lbbody video {
        max-width: 100%;
        max-height: calc(100vh - 190px);
        object-fit: contain;
        border-radius: 10px;
        box-shadow: 0 16px 50px rgba(0, 0, 0, 0.6);
      }
      .lbtext {
        width: min(92vw, 760px);
        max-height: calc(100vh - 190px);
        overflow: auto;
        padding: 20px 24px;
        border-radius: 16px;
        color: #fff;
        font-size: 1.05rem;
        line-height: 1.6;
        white-space: pre-wrap;
        word-break: break-word;
        background: rgba(24, 34, 70, 0.55);
        border: 1.5px solid rgba(255, 255, 255, 0.3);
        box-shadow: 0 16px 50px rgba(0, 0, 0, 0.5);
      }
      .lbcap {
        position: absolute;
        left: 0;
        right: 0;
        bottom: calc(18px + env(safe-area-inset-bottom, 0px));
        text-align: center;
        padding: 0 70px;
      }
      .lbt {
        font-size: 1.1rem;
        color: #fff;
      }
      .lbm {
        margin-top: 2px;
        font-size: 0.85rem;
        color: #9aa6c8;
      }
      .lbx,
      .lbn {
        position: absolute;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.3);
        color: #fff;
        cursor: pointer;
        font-size: 1.6rem;
        line-height: 1;
        width: 42px;
        height: 42px;
        border-radius: 50%;
      }
      .lbx:hover,
      .lbn:hover {
        color: var(--gold);
        border-color: var(--gold);
      }
      .lbx {
        top: calc(14px + env(safe-area-inset-top, 0px));
        right: 16px;
      }
      .lbn {
        top: 50%;
        transform: translateY(-50%);
      }
      .lbn.l {
        left: 12px;
      }
      .lbn.r {
        right: 12px;
      }
      @media (max-width: 640px) {
        .lb {
          padding: 56px 12px 96px;
        }
        .lbn {
          top: auto;
          bottom: calc(22px + env(safe-area-inset-bottom, 0px));
          transform: none;
        }
      }
      .fhint {
        margin-top: 4px;
        font-size: 0.72rem;
        color: #8f9bc2;
      }
      .lbtext a {
        display: inline-block;
        margin-top: 14px;
        color: var(--gold);
      }
    </style>
  </head>
  <body>

    <script>
      const BRANCHES = {

            along = vx * dx + vy * dy;
          if (along <= 0.5) return;
          const perp = Math.abs(vx * dy - vy * dx),
            sc = along + perp * 1.6;
          if (perp <= along * 1.7 && sc < bs) {
            bs = sc;
            best = i;
          }
          if (sc < ls) {
            ls = sc;
            loose = i;
          }
        });
        return best >= 0 ? best : loose;
      }
      function zgo(i) {
        if (i < 0 || i === zi || !zoomStars[i]) return;
        SND.play('tick');
        zi = i;
        updateZoomUI();
        flyVB(viewFor(zoomStars[i].x, zoomStars[i].y, ZOOM), 550);
      }
      function zdir(dx, dy) {
        zgo(pickStar(zi, dx, dy));
      }
      function refreshZoom() {
        zoomStars = starsOf(ITEMS[sel]);
        const keep = cam;
        zoomSVG();
        cam = null;
        setVB(keep || viewFor(zoomStars[zi].x, zoomStars[zi].y, ZOOM));
        updateZoomUI();
      }
      document.getElementById('zback').onclick = exitZoom;
      document.getElementById('zoomLayer').addEventListener('click', (e) => {
        const g = e.target.closest('.zs');
        if (!g || swiped) return;
        +g.dataset.i === zi ? openPanel(zoomStars[zi].key) : zgo(+g.dataset.i);
      });
      updateTop();
      updateBg();

      function openPanel(key) {
        const [branch, sub] = key.split('|');
        const b = BRANCHES[branch];
        const body = document.getElementById('panelBody');
        if (b.type === 'stub') {
          body.innerHTML = `<button class="closeBtn" onclick="closePanel()">×</button>
      <h2>${b.name}</h2><div class="stubNote">Эта ветка пока заглушка — вернёмся к ней позже, когда дойдут руки решить, как её отслеживать.</div>`;
        } else if (b.type === 'multi' && !sub) {
          const rows = b.subs
            .map(
              (x) =>
                `<button type="button" class="subRow" onclick="openPanel('blender|${x.id}')"><span>${x.name}</span><b>${entriesFor(branch, x.id).length}</b></button>`,
            )
            .join('');
          body.innerHTML = `<button class="closeBtn" onclick="closePanel()">×</button>
      <h2>${b.name}</h2><div class="sub">Общий уровень: ${branchLevel(branch)} · выбери навык, чтобы записать результат</div>
      <div class="entries">${rows}</div>`;
        } else if (b.type === 'multi') {
          const s = b.subs.find((x) => x.id === sub);
          const list = entriesFor(branch, sub).sort((a, c) => c.id - a.id);
          body.innerHTML = `<button class="closeBtn" onclick="closePanel()">×</button>
      <button class="backBtn" onclick="openPanel('blender')">‹ Все навыки Blender</button>
      <h2>${b.name} · ${s.name}</h2>
      <div class="sub">Уровень: ${list.length}</div>
      ${renderEntries(list)}
      ${addForm(branch, sub, 'Загрузи рендер и опиши, что сделал')}`;
        } else if (b.type === 'count') {
          const list = entriesFor(branch).sort((a, c) => c.id - a.id);
          const next = b.milestones.find((m) => m > list.length) || b.milestones[b.milestones.length - 1];
          body.innerHTML = `<button class="closeBtn" onclick="closePanel()">×</button>
      <h2>${b.name}</h2>
      <div class="sub">Глав опубликовано: ${list.length} · следующий рубеж: ${next}</div>
      <div class="progressRow"><div class="bar"><i style="width:${Math.min(100, (list.length / next) * 100)}%"></i></div></div>
      ${renderEntries(list)}
      ${addForm(branch, null, 'Отметь опубликованную главу')}`;
        } else if (b.type === 'tier') {
          const tierRow = b.tiers
            .map((t) => {
              const done = entriesFor(branch, t).length > 0;
              return `<button type="button" class="tierBtn ${done ? 'done' : ''} ${sub === t ? 'active' : ''}" onclick="openPanel('english|${t}')">${t}${done ? ' ✓' : ''}</button>`;
            })
            .join('');
          body.innerHTML = `<button class="closeBtn" onclick="closePanel()">×</button>
      <h2>${b.name}${sub ? ' · ' + sub : ''}</h2>
      <div class="tierRow">${tierRow}</div>
      ${renderEntries(entriesFor(branch, sub).sort((a, c) => c.id - a.id))}
      ${addForm(branch, '', 'Подтверди достигнутый уровень', true)}`;
        }
        document.getElementById('overlay').classList.add('open');
        const tsel = body.querySelector('select[name=tier]');
        if (tsel && sub) tsel.value = sub;
        const f = document.getElementById('entryForm');
        if (f) f.addEventListener('submit', (e) => submitEntry(e, branch, sub, b.type));
      }
      let GAL = [];
      const escH = (t) =>
        String(t).replace(
          /[&<>"']/g,
          (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c],
        );
      const TEXT_EXT = /\.(txt|md|markdown|csv|json|log)$/i;
      const VIDEO_EXT = /\.(mp4|m4v|mov|webm|mkv|ogv|avi)$/i;
      // Браузеру нужен «понятный» MIME: .mov из Blender (video/quicktime) в Chrome без этого не играет
      function videoMime(name, type) {
        const ext = ((name || '').split('.').pop() || '').toLowerCase();
        const map = {
          mp4: 'video/mp4',
          m4v: 'video/mp4',
          mov: 'video/mp4',
          webm: 'video/webm',
          mkv: 'video/webm',
          ogv: 'video/ogg',
          avi: 'video/x-msvideo',
        };
        if (map[ext]) return map[ext];
        const t = (type || '').toLowerCase();
        if (t === 'video/quicktime') return 'video/mp4';
        return t.startsWith('video/') ? t : 'video/mp4';
      }
      function dataUrlToBlob(url, type) {
        const i = url.indexOf(','),
          bin = atob(url.slice(i + 1)),
          arr = new Uint8Array(bin.length);
        for (let k = 0; k < bin.length; k++) arr[k] = bin.charCodeAt(k);
        return new Blob([arr], { type: type || url.slice(5, i).split(';')[0] });
      }
      const URLS = new Map();
      function mediaUrl(e) {
        if (e.id != null && URLS.has(e.id)) return URLS.get(e.id);
        let u = '';
        if (e.blob) u = URL.createObjectURL(e.blob);
        else if (e.fileDataUrl)
          u =
            kindOf(e) === 'video'
              ? URL.createObjectURL(dataUrlToBlob(e.fileDataUrl, videoMime(e.fileName, e.fileType)))
              : e.fileDataUrl;
        if (e.id != null) URLS.set(e.id, u);
        return u;
      }
      function fileKind(type, name) {
        const t = (type || '').toLowerCase();
        if (t.startsWith('image')) return 'image';
        if (t.startsWith('video') || VIDEO_EXT.test(name || '')) return 'video';
        if (t.startsWith('text') || TEXT_EXT.test(name || '')) return 'text';
        return 'file';
      }
      function kindOf(e) {
        if (!e.fileDataUrl && !e.blob) return 'note';
        return e.kind || fileKind(e.fileType, e.fileName);
      }
      function b64Text(url, head) {
        try {
          const i = url.indexOf(',');
          if (i < 0) return '';
          let b = url.slice(i + 1);
          if (head) b = b.slice(0, 1200);
          b = b.slice(0, b.length - (b.length % 4));
          const bin = atob(b),
            bytes = new Uint8Array(bin.length);
          for (let k = 0; k < bin.length; k++) bytes[k] = bin.charCodeAt(k);
          return new TextDecoder('utf-8').decode(bytes);
        } catch (err) {
          return '';
        }
      }
      function galItem(e, i) {
        const k = kindOf(e),
          ext = ((e.fileName || '').split('.').pop() || '').toUpperCase().slice(0, 5);
        let inner = '',
          badge = '';
        if (k === 'image') inner = `<img src="${e.fileDataUrl}" alt="" loading="lazy" />`;
        else if (k === 'video') {
          inner = `<video src="${mediaUrl(e)}#t=0.1" muted playsinline preload="metadata"></video><span class="gplay">▶</span>`;
          badge = 'VIDEO';
        } else if (k === 'text') {
          inner = `<div class="gtx">${escH(b64Text(e.fileDataUrl, true).slice(0, 220))}</div>`;
          badge = ext || 'TXT';
        } else if (k === 'file') {
          inner = `<div class="gfile">${escH(ext || 'ФАЙЛ')}</div>`;
        } else inner = `<div class="gtx big">${escH(e.note || '')}</div>`;
        const cap = k === 'note' ? '' : escH(e.note || e.fileName || '');
        return `<div class="gi" data-gi="${i}" tabindex="0">${inner}${badge ? `<span class="gbadge">${badge}</span>` : ''}<div class="gcap">${cap}</div></div>`;
      }
      function renderEntries(list) {
        GAL = list;
        if (!list.length) return `<div class="empty">Пока нет работ — добавь первую ниже.</div>`;
        return `<div class="gal">` + list.map(galItem).join('') + `</div>`;
      }
      const LB = (() => {
        const q = (id) => document.getElementById(id);
        let i = 0,
          sx = null;
        const isOpen = () => q('lb').classList.contains('open');
        function show(n) {
          if (!GAL.length) return;
          i = (n + GAL.length) % GAL.length;
          const e = GAL[i],
            k = kindOf(e),
            b = q('lbBody');
          b.innerHTML = '';
          if (k === 'image') {
            const im = new Image();
            im.src = e.fileDataUrl;
            im.alt = '';
            b.appendChild(im);
          } else if (k === 'video') {
            const v = document.createElement('video');
            v.controls = true;
            v.playsInline = true;
            v.preload = 'metadata';
            v.addEventListener('error', () => {
              b.innerHTML = '';
              const d = document.createElement('div');
              d.className = 'lbtext';
              d.textContent =
                'Не удалось воспроизвести это видео: браузер не поддерживает его формат или кодек.\n\n' +
                'Из Blender: Output Properties → Output → File Format: FFmpeg Video; Encoding → Container: MPEG-4 (или QuickTime); ' +
                'Video Codec: H.264; Audio Codec: AAC. Кодеки вроде PNG, DNxHD, ProRes и контейнеры AVI/MKV браузеры обычно не играют.';
              const a = document.createElement('a');
              a.href = mediaUrl(e);
              a.download = e.fileName || 'video';
              a.textContent = 'Скачать файл';
              d.appendChild(a);
              b.appendChild(d);
            });
            v.src = mediaUrl(e);
            b.appendChild(v);
          } else {
            const d = document.createElement('div');
            d.className = 'lbtext';
            if (k === 'text') {
              const t = b64Text(e.fileDataUrl);
              d.textContent = t.length > 300000 ? t.slice(0, 300000) + '\n…' : t;
            } else if (k === 'note') d.textContent = e.note || '';
            else d.textContent = 'Этот тип файла нельзя показать здесь: ' + (e.fileName || 'файл');
            b.appendChild(d);
          }
          q('lbT').textContent = e.note || e.fileName || '';
          q('lbM').textContent = [e.date, e.fileName && e.note ? e.fileName : '', i + 1 + ' / ' + GAL.length]
            .filter(Boolean)
            .join(' · ');
          q('lbPrev').style.visibility = q('lbNext').style.visibility = GAL.length > 1 ? 'visible' : 'hidden';
        }
        function open(n) {
          q('lb').classList.add('open');
          show(n);
        }
        function close() {
          q('lb').classList.remove('open');
          q('lbBody').innerHTML = '';
        }
        function key(e) {
          if (e.key === 'Escape') {
            e.preventDefault();
            close();
          } else if (e.key === 'ArrowRight') {
            e.preventDefault();
            show(i + 1);
          } else if (e.key === 'ArrowLeft') {
            e.preventDefault();
            show(i - 1);
          }
        }
        q('lbClose').onclick = close;
        q('lbPrev').onclick = () => show(i - 1);
        q('lbNext').onclick = () => show(i + 1);
        q('lb').addEventListener('click', (e) => {
          if (e.target.id === 'lb') close();
        });
        q('lbBody').addEventListener('pointerdown', (e) => (sx = e.clientX));
        q('lbBody').addEventListener('pointerup', (e) => {
          if (sx === null) return;
          const dx = e.clientX - sx;
          sx = null;
          if (Math.abs(dx) > 70) show(i + (dx < 0 ? 1 : -1));
        });
        q('panelBody').addEventListener(
          'error',
          (ev) => {
            const v = ev.target;
            if (!v || v.tagName !== 'VIDEO') return;
            const d = document.createElement('div');
            d.className = 'gfile';
            d.textContent = 'VIDEO';
            const pl = v.parentNode.querySelector('.gplay');
            if (pl) pl.remove();
            v.replaceWith(d);
          },
          true,
        );
        q('panelBody').addEventListener('click', (e) => {
          const g = e.target.closest('[data-gi]');
          if (g) open(+g.dataset.gi);
        });
        q('panelBody').addEventListener('keydown', (e) => {
          if (e.key !== 'Enter') return;
          const g = e.target.closest('[data-gi]');
          if (g) open(+g.dataset.gi);
        });
        return { open, close, key, isOpen };
      })();
      function addForm(branch, sub, noteLabel, isTier) {
        const tierSelect = isTier
          ? `<div><label>Уровень CEFR</label><select name="tier" required>${BRANCHES.english.tiers.map((t) => `<option value="${t}">${t}</option>`).join('')}</select></div>`
          : '';
        return `<form class="addForm" id="entryForm">
    ${tierSelect}
    <div><label>${noteLabel}</label><input type="text" name="note" placeholder="Например: рендер сцены таверны" ${isTier ? '' : 'required'}></div>
    <div><label>Дата</label><input type="date" name="date" value="${new Date().toISOString().slice(0, 10)}"></div>
    <div><label>Файл (картинка / видео / текст)</label><input type="file" name="file" accept="image/*,video/*,text/*,.mov,.mp4,.m4v,.webm,.mkv,.ogv,.avi,.txt,.md,.markdown,.csv,.json"><div class="fhint">Видео: MP4 или MOV с кодеком H.264. Из Blender: FFmpeg Video → H.264.</div></div>
    <button class="btn" type="submit">Записать в карту</button>
  </form>`;
      }
      async function submitEntry(e, branch, sub, type) {
        e.preventDefault();
        const fd = new FormData(e.target);
        const file = fd.get('file');
        const actualSub = type === 'tier' ? fd.get('tier') : sub;
        const rec = {
          branch,
          sub: actualSub || null,
          note: fd.get('note') || '',
          date: fd.get('date') || new Date().toISOString().slice(0, 10),
        };
        if (file && file.size > 0) {
          rec.fileName = file.name;
          rec.kind = fileKind(file.type, file.name);
          rec.fileType = file.type || (rec.kind === 'text' ? 'text/plain' : '');
          if (rec.kind === 'video') {
            rec.fileType = videoMime(file.name, file.type);
            rec.blob = new Blob([file], { type: rec.fileType });
          } else
            rec.fileDataUrl = await new Promise((res) => {
              const r = new FileReader();
              r.onload = () => res(r.result);
              r.readAsDataURL(file);
            });
        }
        const ok = await saveEntry(rec);
        if (ok) {
          ENTRIES = await loadEntries();
          closePanel();
          drawSky();
        }
      }
      function closePanel() {
        document.getElementById('overlay').classList.remove('open');
      }
      document.getElementById('overlay').addEventListener('click', (e) => {
        if (e.target.id === 'overlay') closePanel();
      });
      document.getElementById('charName').addEventListener('change', (e) => {
        try {
          localStorage.setItem('skilltree_name', e.target.value);
        } catch (err) {}
      });
      try {
        const savedName = localStorage.getItem('skilltree_name');
        if (savedName) document.getElementById('charName').value = savedName;
      } catch (err) {}

      (async function init() {
        try {
          db = await openDB();
          ENTRIES = await loadEntries();
        } catch (e) {
          ENTRIES = [];
        }
        drawSky();
        try {
          await MUS.init();
        } catch (e) {}
      })();
    </script>
  </body>
</html>
